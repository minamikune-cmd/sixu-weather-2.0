name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 先构建 Web 产物并同步到 android/app/src/main/assets/public
      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Assemble debug APK
        run: cd android && ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sixu-weather-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Android signed release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, android]
    # 只在 push 到 main 或手动触发时产出 release 产物
    if: github.event_name != 'pull_request'
    # 密钥只来自仓库加密 Secrets，绝不写入仓库代码或日志
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 先构建 Web 产物并同步到 android/app/src/main/assets/public
      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Decode keystore and write keystore.properties
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/sixu-weather-release.jks
          printf 'storeFile=../sixu-weather-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > android/keystore.properties

      - name: Build signed release APK and AAB
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: cd android && ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build unsigned release APK and AAB (no secrets configured)
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: |
          echo "::warning::未配置签名 Secrets，产出未签名 release 产物（流水线验证用，不可发布）。"
          cd android && ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sixu-weather-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sixu-weather-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
